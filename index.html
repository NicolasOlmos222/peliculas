<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine Club - Nico & Ani</title>
  
  <!-- Evita el error 404 del favicon cargando uno vacío temporal -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Vuetify & Material Design Icons CSS -->
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.x/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3.5.2/dist/vuetify.min.css" rel="stylesheet">
</head>
<body>
  <!-- Contenedor raíz donde Vue va a montar la app -->
  <div id="app"></div>

  <!-- Scripts de Vue 3 y Vuetify 3 de forma global -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.5.2/dist/vuetify.min.js"></script>

  <script>
    // En lugar de usar 'import', extraemos las funciones del objeto global 'Vue'
    const { createApp, ref, onMounted } = Vue;
    const { createVuetify } = Vuetify;

    const vuetify = createVuetify();

    const app = createApp({
      template: `
        <v-app class="bg-grey-darken-4">
          <!-- Barra de Navegación -->
          <v-app-bar color="teal-darken-3" elevation="3">
            <v-app-bar-title class="font-weight-bold">
              🍿 Cine Club - Nico & Ani
            </v-app-bar-title>
            <v-spacer></v-spacer>
            <v-btn 
              prepend-icon="mdi-plus" 
              variant="elevated" 
              color="amber-accent-4" 
              class="text-black font-weight-bold mr-3"
              @click="dialog = true"
            >
              Agregar Película
            </v-btn>
          </v-app-bar>

          <!-- Contenido Principal -->
          <v-main>
            <v-container>
              
              <!-- Loader mientras cargan los datos de tu Google Sheet -->
              <v-row v-if="cargando" class="justify-center align-center mt-12">
                <v-col cols="12" class="text-center">
                  <v-progress-circular indeterminate color="teal-accent-3" size="64"></v-progress-circular>
                  <p class="text-grey-lighten-1 mt-4">Abriendo la cartelera...</p>
                </v-col>
              </v-row>

              <!-- Lista de Películas -->
              <v-row v-else-if="peliculas.length > 0">
                <v-col 
                  v-for="(pelicula, index) in peliculas" 
                  :key="index" 
                  cols="12" sm="6" md="4" lg="3"
                >
                  <v-card class="mx-auto my-3 bg-grey-gradient elevation-5 position-relative" max-width="342">
                    <!-- Botón Eliminar -->
                    <v-btn
                      icon="mdi-delete"
                      size="small"
                      color="error"
                      variant="text"
                      class="position-absolute text-white"
                      style="top: 5px; right: 5px; z-index: 2; background: rgba(0,0,0,0.4);"
                      @click="eliminarPelicula(pelicula.nombre)"
                    ></v-btn>

                    <!-- Imagen de la Película -->
                    <v-img
                      :src="pelicula.foto || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=500'"
                      height="400"
                      cover
                      class="align-end text-white"
                    >
                      <v-card-title class="bg-black-gradient font-weight-bold pb-2">
                        {{ pelicula.nombre }}
                      </v-card-title>
                    </v-img>

                    <!-- Sección de Puntuaciones -->
                    <v-card-text class="pt-4">
                      <!-- Puntuación Nico -->
                      <div class="mb-4">
                        <div class="d-flex justify-space-between align-center mb-1">
                          <span class="font-weight-medium text-subtitle-1 text-teal-accent-2">⭐ Nico:</span>
                          <v-chip size="small" color="teal-accent-2" variant="tonal" class="font-weight-bold">
                            {{ pelicula.ratingnico || 'Sin puntuar' }}
                          </v-chip>
                        </div>
                        <v-rating
                          v-model="pelicula.ratingnico"
                          color="amber-accent-3"
                          active-color="amber-accent-3"
                          half-increments
                          hover
                          density="comfortable"
                          size="32"
                          @update:model-value="actualizarPuntaje(pelicula)"
                        ></v-rating>
                      </div>

                      <v-divider class="my-2 border-opacity-25"></v-divider>

                      <!-- Puntuación Ani -->
                      <div class="mt-3">
                        <div class="d-flex justify-space-between align-center mb-1">
                          <span class="font-weight-medium text-subtitle-1 text-pink-accent-2">❤️ Ani:</span>
                          <v-chip size="small" color="pink-accent-2" variant="tonal" class="font-weight-bold">
                            {{ pelicula.ratingani || 'Sin puntuar' }}
                          </v-chip>
                        </div>
                        <v-rating
                          v-model="pelicula.ratingani"
                          color="amber-accent-3"
                          active-color="amber-accent-3"
                          half-increments
                          hover
                          density="comfortable"
                          size="32"
                          @update:model-value="actualizarPuntaje(pelicula)"
                        ></v-rating>
                      </div>
                    </v-card-text>
                  </v-card>
                </v-col>
              </v-row>

              <!-- Estado de lista vacía -->
              <v-row v-else class="justify-center align-center text-center mt-12">
                <v-col cols="12">
                  <v-icon size="80" color="grey-darken-1">mdi-movie-open-outline</v-icon>
                  <p class="text-h5 text-grey-lighten-1 mt-4">No hay películas agregadas todavía.</p>
                  <p class="text-subtitle-1 text-grey-darken-1">¡Agreguen la primera para empezar a puntuar!</p>
                </v-col>
              </v-row>
            </v-container>
          </v-main>

          <!-- Diálogo Modal para Añadir Película -->
          <v-dialog v-model="dialog" max-width="500px" persistent>
            <v-card class="bg-grey-darken-3 text-white">
              <v-card-title class="text-h5 font-weight-bold pa-4 bg-teal-darken-3">
                Nueva Película
              </v-card-title>
              
              <v-card-text class="pa-4">
                <v-form ref="form" @submit.prevent="guardarPelicula">
                  <v-text-field
                    v-model="nuevaPelicula.nombre"
                    label="Nombre de la película"
                    variant="outlined"
                    color="teal-accent-3"
                    required
                  ></v-text-field>

                  <v-text-field
                    v-model="nuevaPelicula.foto"
                    label="URL de la imagen/póster"
                    placeholder="https://ejemplo.com/imagen.jpg"
                    variant="outlined"
                    color="teal-accent-3"
                    hint="Copiá el link de la imagen de Google o IMDb"
                    persistent-hint
                  ></v-text-field>
                </v-form>
              </v-card-text>

              <v-card-actions class="pa-4 pt-0">
                <v-spacer></v-spacer>
                <v-btn color="grey-lighten-1" variant="text" :disabled="enviando" @click="cerrarDialog">Cancelar</v-btn>
                <v-btn 
                  color="teal-accent-3" 
                  variant="elevated" 
                  class="text-black font-weight-bold" 
                  @click="guardarPelicula"
                  :disabled="!nuevaPelicula.nombre || enviando"
                >
                  {{ enviando ? 'Guardando...' : 'Agregar' }}
                </v-btn>
              </v-card-actions>
            </v-card>
          </v-dialog>
        </v-app>
      `,
      setup() {
        // Tu endpoint real ya implementado
        const API_URL = 'https://sheetdb.io/api/v1/yeqh6gl5dgjxz';

        const dialog = ref(false);
        const cargando = ref(true);
        const enviando = ref(false);
        const peliculas = ref([]);
        
        const nuevaPelicula = ref({
          nombre: '',
          foto: '',
          ratingnico: 0,
          ratingani: 0
        });

        // 1. Leer películas desde tu Google Sheet
        const obtenerPeliculas = async () => {
          try {
            cargando.value = true;
            const respuesta = await fetch(API_URL);
            const datos = await respuesta.json();
            
            // Convertimos las puntuaciones de texto a número flotante para que ande el v-rating
            peliculas.value = datos.map(p => ({
              ...p,
              ratingnico: parseFloat(p.ratingnico) || 0,
              ratingani: parseFloat(p.ratingani) || 0
            }));
          } catch (error) {
            console.error("Error consultando la API de SheetDB:", error);
          } finally {
            cargando.value = false;
          }
        };

        // 2. Guardar nueva película en la planilla
        const guardarPelicula = async () => {
          if (nuevaPelicula.value.nombre.trim() === '') return;

          try {
            enviando.value = true;
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [nuevaPelicula.value] })
            });
            
            await obtenerPeliculas(); // Actualiza la UI
            cerrarDialog();
          } catch (error) {
            console.error("Error al registrar película:", error);
          } finally {
            enviando.value = false;
          }
        };

        // 3. Actualizar puntaje de Nico o Ani en tiempo real
        const actualizarPuntaje = async (pelicula) => {
          try {
            // Buscamos en la planilla por la columna 'nombre'
            await fetch(`${API_URL}/nombre/${encodeURIComponent(pelicula.nombre)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                data: {
                  ratingnico: pelicula.ratingnico,
                  ratingani: pelicula.ratingani
                }
              })
            });
          } catch (error) {
            console.error("Error actualizando la calificación:", error);
          }
        };

        // 4. Eliminar una película de la lista y del Sheet
        const eliminarPelicula = async (nombrePeli) => {
          if (confirm(`¿Seguro de que querés eliminar "${nombrePeli}" del Cine Club?`)) {
            try {
              await fetch(`${API_URL}/nombre/${encodeURIComponent(nombrePeli)}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
              });
              await obtenerPeliculas();
            } catch (error) {
              console.error("Error eliminando la película de la base de datos:", error);
            }
          }
        };

        const cerrarDialog = () => {
          dialog.value = false;
          nuevaPelicula.value = { nombre: '', foto: '', ratingnico: 0, ratingani: 0 };
        };

        // Ciclo de vida: Carga inicial de datos al arrancar
        onMounted(() => {
          obtenerPeliculas();
        });

        return {
          dialog,
          cargando,
          enviando,
          peliculas,
          nuevaPelicula,
          guardarPelicula,
          cerrarDialog,
          actualizarPuntaje,
          eliminarPelicula
        };
      }
    });

    // Le inyectamos Vuetify a la app y la montamos en el div #app
    app.use(vuetify).mount('#app');
  </script>

  <style>
    /* Estética modo cine oscuro */
    .bg-grey-gradient {
      background: #262626 !important;
      border: 1px solid #3a3a3a !important;
    }
    .bg-black-gradient {
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 70%, rgba(0,0,0,0) 100%) !important;
    }
  </style>
</body>
</html>
