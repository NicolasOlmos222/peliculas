<template>
  <v-app class="bg-grey-darken-4">
    <!-- Barra de Navegación -->
    <v-app-bar color="teal-darken-3" elevation="3">
      <v-app-bar-title class="font-weight-bold">🍿 Cine Club - Nico & Ani</v-app-bar-title>
      <v-spacer></v-spacer>
      <v-btn prepend-icon="mdi-plus" color="amber-accent-4" class="text-black font-weight-bold mr-3" @click="dialog = true">
        Agregar Película
      </v-btn>
    </v-app-bar>

    <!-- Contenido Principal -->
    <v-main>
      <v-container>
        <!-- Loader mientras cargan los datos de la planilla -->
        <v-row v-if="cargando" class="justify-center align-center mt-12">
          <v-col cols="12" class="text-center">
            <v-progress-circular indeterminate color="teal-accent-3" size="64"></v-progress-circular>
            <p class="text-grey-lighten-1 mt-4">Abriendo la cartelera...</p>
          </v-col>
        </v-row>

        <!-- Lista de Películas -->
        <v-row v-else-if="peliculas.length > 0">
          <v-col v-for="(pelicula, index) in peliculas" :key="index" cols="12" sm="6" md="4" lg="3">
            <v-card class="mx-auto my-3 bg-grey-gradient position-relative" max-width="342">
              <v-img :src="pelicula.foto || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=500'" height="400" cover class="align-end text-white">
                <v-card-title class="bg-black-gradient font-weight-bold pb-2">{{ pelicula.nombre }}</v-card-title>
              </v-img>
              
              <v-card-text class="pt-4">
                <!-- Nico -->
                <div class="mb-4">
                  <div class="d-flex justify-space-between align-center mb-1">
                    <span class="font-weight-medium text-subtitle-1 text-teal-accent-2">⭐ Nico:</span>
                    <v-chip size="small" color="teal-accent-2" variant="tonal" class="font-weight-bold">
                      {{ pelicula.ratingnico || 'Sin puntuar' }}
                    </v-chip>
                  </div>
                  <!-- @update:model-value ejecuta la función cuando cambias las estrellas -->
                  <v-rating 
                    v-model="pelicula.ratingnico" 
                    color="amber-accent-3" 
                    active-color="amber-accent-3" 
                    half-increments 
                    hover 
                    size="32"
                    @update:model-value="actualizarPuntaje(pelicula)"
                  ></v-rating>
                </div>
                
                <v-divider class="my-2 border-opacity-25"></v-divider>
                
                <!-- Ani -->
                <div class="mt-3">
                  <div class="d-flex justify-space-between align-center mb-1">
                    <span class="font-weight-medium text-subtitle-1 text-pink-accent-2">❤️ Ani:</span>
                    <v-chip size="small" color="pink-accent-2" variant="tonal" class="font-weight-bold">
                      {{ pelicula.ratingani || 'Sin puntuar' }}
                    </v-chip>
                  </div>
                  <v-rating 
                    v-model="pelicula.ratingani" 
                    color="amber-accent-3" 
                    active-color="amber-accent-3" 
                    half-increments 
                    hover 
                    size="32"
                    @update:model-value="actualizarPuntaje(pelicula)"
                  ></v-rating>
                </div>
              </v-card-text>
            </v-card>
          </v-col>
        </v-row>

        <!-- Estado vacío -->
        <v-row v-else class="justify-center align-center text-center mt-12">
          <v-col cols="12">
            <v-icon size="80" color="grey-darken-1">mdi-movie-open-outline</v-icon>
            <p class="text-h5 text-grey-lighten-1 mt-4">No hay películas todavía.</p>
          </v-col>
        </v-row>
      </v-container>
    </v-main>

    <!-- Modal para Agregar -->
    <v-dialog v-model="dialog" max-width="500px">
      <v-card class="bg-grey-darken-3 text-white">
        <v-card-title class="text-h5 font-weight-bold pa-4 bg-teal-darken-3">Nueva Película</v-card-title>
        <v-card-text class="pa-4">
          <v-text-field v-model="nuevaPelicula.nombre" label="Nombre de la película" variant="outlined" color="teal-accent-3" required></v-text-field>
          <v-text-field v-model="nuevaPelicula.foto" label="URL de la imagen" variant="outlined" color="teal-accent-3"></v-text-field>
        </v-card-text>
        <v-card-actions class="pa-4 pt-0">
          <v-spacer></v-spacer>
          <v-btn color="grey-lighten-1" variant="text" @click="cerrarDialog">Cancelar</v-btn>
          <v-btn color="teal-accent-3" variant="elevated" class="text-black font-weight-bold" @click="guardarPelicula" :disabled="!nuevaPelicula.nombre || enviando">
            {{ enviando ? 'Guardando...' : 'Agregar' }}
          </v-btn>
        </v-card-actions>
      </v-card>
    </v-dialog>
  </v-app>
</template>

<script setup>
import { ref, onMounted } from 'vue'

// !!! REMPLAZÁ ESTA URL CON TU LINK DE SHEETDB !!!
const API_URL = 'https://sheetdb.io/api/v1/tu_codigo_de_sheetdb'

const dialog = ref(false)
const cargando = ref(true)
const enviando = ref(false)
const peliculas = ref([])
const nuevaPelicula = ref({ nombre: '', foto: '', ratingnico: 0, ratingani: 0 })

// 1. Leer las películas de la planilla al cargar la página
const obtenerPeliculas = async () => {
  try {
    cargando.value = true
    const respuesta = await fetch(API_URL)
    const datos = await respuesta.json()
    
    // Convertimos los strings de la planilla a números para el componente v-rating
    peliculas.value = datos.map(p => ({
      ...p,
      ratingnico: parseFloat(p.ratingnico) || 0,
      ratingani: parseFloat(p.ratingani) || 0
    }))
  } catch (error) {
    console.error("Error leyendo datos de Google Sheets:", error)
  } finally {
    cargando.value = false
  }
}

// 2. Insertar una nueva fila en Google Sheets
const guardarPelicula = async () => {
  if (!nuevaPelicula.value.nombre.trim()) return
  
  try {
    enviando.value = true
    // SheetDB espera los datos envueltos en un objeto "data"
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [nuevaPelicula.value] })
    })
    
    await obtenerPeliculas() // Recargamos la lista actualizada
    cerrarDialog()
  } catch (error) {
    console.error("Error al guardar en la planilla:", error)
  } finally {
    enviando.value = false
  }
}

// 3. Modificar puntuaciones existentes
const actualizarPuntaje = async (pelicula) => {
  try {
    // Buscamos en la planilla por la columna 'nombre' y actualizamos los ratings
    await fetch(`${API_URL}/nombre/${encodeURIComponent(pelicula.nombre)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: {
        ratingnico: pelicula.ratingnico,
        ratingani: pelicula.ratingani
      }})
    })
  } catch (error) {
    console.error("Error al actualizar el puntaje:", error)
  }
}

const cerrarDialog = () => {
  dialog.value = false
  nuevaPelicula.value = { nombre: '', foto: '', ratingnico: 0, ratingani: 0 }
}

onMounted(() => {
  obtenerPeliculas()
})
</script>

<style scoped>
.bg-grey-gradient {
  background: #262626 !important;
  border: 1px solid #3a3a3a !important;
}
.bg-black-gradient {
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 70%, rgba(0,0,0,0) 100%) !important;
}
